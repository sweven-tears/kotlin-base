[versions]
agp = "8.13.0"
kotlin = "2.2.0"
coreKtx = "1.10.1"
junit = "4.+"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
activity = "1.8.0"
fragment = "1.3.6"
constraintlayout = "2.1.4"

[libraries]
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Coroutines
kotlinx_coroutines_core      = "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
kotlinx_coroutines_android   = "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"

# Lifecycle
lifecycle_viewmodel_ktx      = "androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1"
lifecycle_runtime_ktx        = "androidx.lifecycle:lifecycle-runtime-ktx:2.5.1"
recyclerview                 = "androidx.recyclerview:recyclerview:1.1.0"
swipe_refresh                = "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
core_ktx                     = "androidx.core:core-ktx:1.10.0"

# JSON
gson                         = "com.google.code.gson:gson:2.10.1"
gson_factory                 = "com.github.getActivity:GsonFactory:9.6"

# Image Loading
glide                        = "com.github.bumptech.glide:glide:4.12.0"
glide_compiler               = "com.github.bumptech.glide:compiler:4.12.0"

# Network
okhttp                       = "com.squareup.okhttp3:okhttp:3.9.0"
logging_intercepter          = "com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.2"
retrofit                     = "com.squareup.retrofit2:retrofit:2.9.0"
retrofit_gson                = "com.squareup.retrofit2:converter-gson:2.9.0"
adapter_rxjava               = "com.squareup.retrofit2:adapter-rxjava2:2.9.0"

# ReactiveX
rxandroid                    = "io.reactivex.rxjava2:rxandroid:2.0.2"
rxlifecycle_components       = "com.trello.rxlifecycle2:rxlifecycle-components:2.1.0"

# Kotlin
kotlin_stdlib                = "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.6.10"

# Annotation Processing
processor_common             = "com.google.auto:auto-common:1.2"
processor_service            = "com.google.auto.service:auto-service:1.0-rc3"
processor_javapoet           = "com.squareup:javapoet:1.7.0"

# Umeng
umsdk_common                 = "com.umeng.umsdk:common:9.1.0"
umsdk_asms                   = "com.umeng.umsdk:asms:1.1.3"
umsdk_crash                  = "com.umeng.umsdk:crash:0.0.4"
umsdk_oaid_lenovo            = "com.umeng.umsdk:oaid_lenovo:1.0.0"
umsdk_oaid_mi                = "com.umeng.umsdk:oaid_mi:1.0.0"
umsdk_oaid_oppo              = "com.umeng.umsdk:oaid_oppo:1.0.4"
umsdk_oaid_vivo              = "com.umeng.umsdk:oaid_vivo:1.0.0.1"

# Memory Leak Detection
leak_debug                   = "com.squareup.leakcanary:leakcanary-android:1.5.4"
leak_release                 = "com.squareup.leakcanary:leakcanary-android-no-op:1.5.4"

# UI
immerse                      = "com.gyf.immersionbar:immersionbar:3.0.0"
immerse_components           = "com.gyf.immersionbar:immersionbar-components:3.0.0"
immersionbar_ktx             = "com.geyifeng.immersionbar:immersionbar-ktx:3.2.2"

# Router
arouter_api                  = "com.alibaba:arouter-api:1.5.2"
arouter_compiler             = "com.alibaba:arouter-compiler:1.5.2"

# RecyclerView
lfrecyclerview               = "com.github.limxing:LFRecyclerView-Android:1.0.5"
recyclerview_swipe           = "com.yanzhenjie.recyclerview:x:1.3.2"
pagerlayoutmanager           = "com.github.shenbengit:PagerGridLayoutManager:1.1.8"

# Refresh Layout
smart_refresh_kernel         = "com.scwang.smart:refresh-layout-kernel:2.0.1"
smart_refresh_classics       = "com.scwang.smart:refresh-header-classics:2.0.1"
smart_refresh_radar          = "com.scwang.smart:refresh-header-radar:2.0.1"
smart_refresh_falsify        = "com.scwang.smart:refresh-header-falsify:2.0.1"
smart_refresh_material       = "com.scwang.smart:refresh-header-material:2.0.1"
smart_refresh_two_level      = "com.scwang.smart:refresh-header-two-level:2.0.1"
smart_refresh_ball           = "com.scwang.smart:refresh-footer-ball:2.0.1"
smart_refresh_classics_footer= "com.scwang.smart:refresh-footer-classics:2.0.1"

# Utils
countdown                    = "com.github.iwgang:countdownview:2.1.6"
banner                       = "com.github.donkingliang:CustomBanner:1.1.3"
permission                   = "com.yanzhenjie:permission:2.0.3"
pager_title                  = "com.gxz.pagerslidingtabstrip:library:1.3.1"
update_plugin                = "com.github.MZCretin:AutoUpdateProject:2.0.5"

# Dialog
xxqaq_android_faster         = "com.github.XXQAQ:AndroidFaster:3.29.0"
xxqaq_worldbean              = "com.github.XXQAQ:WorldBean:1.20.0"
xxqaq_android_resource       = "com.github.XXQAQ:AndroidResource:2.10.1"
android_gif_drawable         = "pl.droidsonroids.gif:android-gif-drawable:1.2.12"

# Payment
pay_relinran                 = "com.github.RelinRan:AndroidPay:1.0.11"

# UI Components
red_badge                    = "com.github.chendongde310:SuperBadge:0.2.2"
like_button                  = "com.github.jd-alexander:LikeButton:0.1.3"

# Push
jpush                        = "cn.jiguang.sdk:jpush:3.1.5"
jpush_jcore                  = "cn.jiguang.sdk:jcore:1.2.3"

# Live
live_sdk                     = "com.tencent.liteavsdk:LiteAVSDK_Smart:8.5.10028"
live_danmu                   = "com.github.ctiao:DanmakuFlameMaster:0.9.25"

# Video Player
exoplayer                    = "com.google.android.exoplayer:exoplayer:2.11.8"
exoplayer_ui                 = "com.google.android.exoplayer:exoplayer-ui:2.16.1"
exoplayer_core               = "com.google.android.exoplayer:exoplayer-core:2.16.1"
exoplayer_dash               = "com.google.android.exoplayer:exoplayer-dash:2.16.1"
jiecao_player                = "fm.jiecao:jiecaovideoplayer:5.8.1"

# Media Picker
photo_choose                 = "com.github.HuanTanSheng:EasyPhotos:3.1.5"
picture_selector             = "io.github.lucksiege:pictureselector:v3.11.2"

# PDF
pdf                          = "es.voghdev.pdfviewpager:library:1.0.3"

# Pickers
pickerView                   = "com.contrarywind:Android-PickerView:4.1.9"
wheelView                    = "com.wx.wheelview:wheelview:1.3.3"

# Crash Reporting
bugly                        = "com.tencent.bugly:crashreport:latest.release"
bugly_upgrade                = "com.tencent.bugly:crashreport_upgrade:latest.release"
bugly_native                 = "com.tencent.bugly:nativecrashreport:latest.release"

# Base Library
sweven_codeBase                         = "com.github.sweven-tears:kotlin-base:1.3.3-sdk30"

# Charts
line_chart                   = "com.github.PhilJay:MPAndroidChart:v3.1.0"

# Image Preview
photo_preview                = "com.github.chrisbanes:PhotoView:2.3.0"

# Location
tencent_location             = "com.tencent.map.geolocation:TencentLocationSdk-openplatform:7.5.4.3"

# AMap
amap_location                = "com.amap.api:location:6.5.0"
amap_search                  = "com.amap.api:search:9.7.0"
amap_map3d                   = "com.amap.api:3dmap-location-search:10.1.300_loc6.4.9_sea9.7.4"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }

