apply plugin: "com.android.application"
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace "com.app.test"

    buildFeatures {
        dataBinding = true
    }

    signingConfigs {
        release {
            storeFile file(rootProject.ext.signConf["storeFile"])
            storePassword rootProject.ext.signConf["storePassword"]
            keyAlias rootProject.ext.signConf["keyAlias"]
            keyPassword rootProject.ext.signConf["keyPassword"]
        }
    }

    compileSdkVersion rootProject.ext.android["compileSdkVersion"]
    buildToolsVersion rootProject.ext.android["buildToolsVersion"]

    defaultConfig {
        applicationId "com.app.test"
        manifestPlaceholders = [
                JPUSH_PKGNAME: applicationId,
                JPUSH_APPKEY : "",
                JPUSH_CHANNEL: "developer-default",
        ]
        minSdkVersion rootProject.ext.android["minSdkVersion"]
        targetSdkVersion rootProject.ext.android["targetSdkVersion"]
        versionCode rootProject.ext.android["versionCode"]
        versionName rootProject.ext.android["versionName"]
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"


        ndk {
            abiFilters 'armeabi', 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
//            signingConfig signingConfigs.release
        }
        debug {
//            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility rootProject.ext.android["sourceCompatibility"]
        targetCompatibility rootProject.ext.android["targetCompatibility"]
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    // 一定要写在android节点中
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "base_v${versionName}_${variant.buildType.name}.apk"
        }
    }

    // 处理报错信息：Inheritance from an interface with '@JvmDefault' members is only allowed with -Xjvm-default option
    kotlinOptions {
        jvmTarget = "1.8"
        freeCompilerArgs += ["-Xjvm-default=all"]
    }
}

kapt {
    arguments {
        arg("AROUTER_MODULE_NAME", project.getName())
    }
}

dependencies {

    implementation fileTree(includes: ['*.jar'], dir: 'libs')

    implementation rootProject.ext.dependencies["kotlin"]
    implementation rootProject.ext.dependencies["core-ktx"]

    implementation rootProject.ext.dependencies["appcompat"]
    implementation rootProject.ext.dependencies["meterial"]
    implementation rootProject.ext.dependencies["constraintlayout"]
    testImplementation rootProject.ext.dependencies["junit"]
    androidTestImplementation rootProject.ext.dependencies["ext.junit"]
    androidTestImplementation rootProject.ext.dependencies["espresso"]

    implementation rootProject.ext.dependencies["permission"]
    implementation rootProject.ext.dependencies["update-plugin"]
    implementation rootProject.ext.dependencies['photo-choose']
//    implementation rootProject.ext.dependencies['exoplayer']
//    implementation rootProject.ext.dependencies['exoplayer-ui']

    implementation rootProject.ext.dependencies["smart-refresh-kernel"]
    implementation rootProject.ext.dependencies["smart-refresh-classics"]
    implementation rootProject.ext.dependencies["smart-refresh-classics-footer"]

    kapt rootProject.ext.dependencies["arouter-compiler"]

    implementation rootProject.ext.dependencies["smart-refresh-kernel"]

    implementation project(':common')

    implementation "androidx.room:room-ktx:2.4.0"
    kapt "androidx.room:room-compiler:2.4.0"

    implementation "androidx.core:core-ktx:1.9.0"
    implementation rootProject.ext.dependencies["kc-core"]
    implementation rootProject.ext.dependencies["kc-android"]
    implementation rootProject.ext.dependencies["scope-viewmodel"]
    implementation rootProject.ext.dependencies["scope-runtime"]

    implementation "androidx.activity:activity-ktx:1.4.0"
    implementation "androidx.fragment:fragment-ktx:1.4.1"

//    implementation 'com.github.sweven-tears:Album:1.1.0'
}